name: Publish

on:
  push:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: 3.11
  JSIGN_VERSION: "7.6"
  JSIGN_SHA256: 6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5

jobs:
  publish:
    # To enable auto publishing to github, update your electron publisher
    # config in package.json > "build" and remove the conditional below
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
      # Lets the Windows job trade a GitHub OIDC token for an Azure code-signing token
      id-token: write
    strategy:
      matrix:
        platform:
          [
            { os: "ubuntu-latest", cmd: "--linux" },
            { os: "macos-latest", cmd: "--mac --universal" },
            { os: "windows-latest", cmd: "--win" },
          ]

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: add git binaries to PATH on Windows
        if: runner.os == 'Windows'
        run: |
          echo "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\Git\mingw64\libexec\git-core" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install and build
        run: |
          npm cache clean --force
          npm install
          npm run postinstall
          npm run build

      # Windows signing runs only in the canonical repo, the one identity Azure trusts. A fork
      # skips these steps and myWindowsSignHook.ts leaves its build unsigned.
      - name: Azure login for Windows signing
        if: runner.os == 'Windows' && github.repository == 'guspuffygit/sentient-sims-app'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Fetch jsign and a code-signing token
        id: windows-signing
        if: runner.os == 'Windows' && github.repository == 'guspuffygit/sentient-sims-app'
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'jsign.jar'
          Invoke-WebRequest -Uri "https://github.com/ebourg/jsign/releases/download/$env:JSIGN_VERSION/jsign-$env:JSIGN_VERSION.jar" -OutFile $jar
          if ((Get-FileHash $jar -Algorithm SHA256).Hash -ne $env:JSIGN_SHA256) { throw 'jsign.jar does not match JSIGN_SHA256' }
          $token = az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv
          if (-not $token) { throw 'az returned no code-signing token' }
          "::add-mask::$token"
          "token=$token" >> $env:GITHUB_OUTPUT
          "jar=$jar" >> $env:GITHUB_OUTPUT

      - name: Publish releases
        if: runner.os != 'macOS'
        env:
          # This is used for uploading release assets to github
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by myWindowsSignHook.ts; empty outside the canonical repo's Windows job
          AZURE_CODESIGN_TOKEN: ${{ steps.windows-signing.outputs.token }}
          JSIGN_JAR: ${{ steps.windows-signing.outputs.jar }}
        run: |
          npm exec electron-builder -- --publish always ${{ matrix.platform.cmd }}

      # Smart App Control blocks any unsigned binary the app loads, and installed copies refuse
      # an update whose publisher is not this one, so an unsigned file fails the job.
      - name: Verify Windows signatures
        if: runner.os == 'Windows' && github.repository == 'guspuffygit/sentient-sims-app'
        run: |
          $files = @(Get-ChildItem release/build/win-unpacked -Recurse -Include *.exe, *.dll, *.node) + @(Get-ChildItem release/build -Filter *.exe)
          $unsigned = foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike 'CN=Sentient Simulations LLC,*') {
              "$($file.FullName): $($signature.Status) $($signature.SignerCertificate.Subject)"
            }
          }
          if ($unsigned) {
            $unsigned
            throw "$(@($unsigned).Count) of $($files.Count) Windows binaries are not signed by Sentient Simulations LLC"
          }
          "All $($files.Count) Windows binaries are signed by Sentient Simulations LLC"

      - name: Publish mac universal release
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing: electron-builder decodes the base64 p12 and manages its own keychain
          CSC_LINK: ${{ secrets.APPLE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          # electron-builder's built-in notarization (notarize + staple) activates on these
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm exec electron-builder -- --publish always ${{ matrix.platform.cmd }}
